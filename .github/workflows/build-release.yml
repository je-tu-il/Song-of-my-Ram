name: Build & Release Song-of-my-Ram

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name "Song-of-my-Ram" main.py

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_release\Song-of-my-Ram-Windows-x64" -Force | Out-Null
          Copy-Item "dist\Song-of-my-Ram.exe" "dist_release\Song-of-my-Ram-Windows-x64\" -Force
          Copy-Item "README.md" "dist_release\Song-of-my-Ram-Windows-x64\" -Force
          Compress-Archive -Path "dist_release\Song-of-my-Ram-Windows-x64\*" -DestinationPath "dist\Song-of-my-Ram-Windows-Portable.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Song-of-my-Ram-Windows-Executable
          path: |
            dist/Song-of-my-Ram.exe
            dist/Song-of-my-Ram-Windows-Portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Song of my RAM ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          files: |
            dist/Song-of-my-Ram.exe
            dist/Song-of-my-Ram-Windows-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
